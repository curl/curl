---
name: 'curl-for-win'

'on':
  push:
    branches:
      - master
      - 'curl-*'
      - '*/ci'
    paths-ignore:
      - '**/*.md'
      - 'appveyor.*'
      - 'Dockerfile'
      - 'projects/**'
  pull_request:
    branches:
      - master
      - 'curl-*'
    paths-ignore:
      - '**/*.md'
      - 'appveyor.*'
      - 'Dockerfile'
      - 'projects/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}
cache-mode: none

env:
  CW_NOGET: 'curl trurl'
  CW_MAP: '0'
  CW_JOBS: '5'
  CW_NOPKG: '1'
  DO_NOT_TRACK: '1'

jobs:
  linux-glibc-gcc:
    name: 'Linux gcc glibc (amd64, arm64)'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: 'curl'
          fetch-depth: 8
      - name: 'build'
        run: |
          git clone --depth 1 https://github.com/curl/curl-for-win
          mv curl-for-win/* .
          export CW_CONFIG='-main-werror-unitybatch-nocertdata-linux-a64-x64-gcc'
          export CW_REVISION="${GITHUB_SHA}"
          . ./_versions.sh
          export CW_GCCSUFFIX='-12'
          sudo podman image trust set --type reject default
          sudo podman image trust set --type accept docker.io/library
          time podman pull "${OCI_IMAGE_DEBIAN_STABLE}"
          podman images --digests
          time podman run --volume "$(pwd):$(pwd)" --workdir "$(pwd)" \
            --env-file <(env | grep -a -E \
              '^(CI\b|CW_|DO_NOT_TRACK|GITHUB_)') \
            "${OCI_IMAGE_DEBIAN_STABLE}" \
            sh -c ./_ci-linux-debian.sh

  linux-glibc-gcc-minimal:  # use gcc to minimize installed packages
    name: 'Linux gcc glibc minimal (amd64)'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: 'curl'
          fetch-depth: 8
      - name: 'build'
        run: |
          git clone --depth 1 https://github.com/curl/curl-for-win
          mv curl-for-win/* .
          export CW_CONFIG='-main-werror-unitybatch-nocertdata-prefill-zero-osnotls-osnoidn-nohttp-nocurltool-linux-x64-gcc'
          export CW_REVISION="${GITHUB_SHA}"
          . ./_versions.sh
          sudo podman image trust set --type reject default
          sudo podman image trust set --type accept docker.io/library
          time podman pull "${OCI_IMAGE_DEBIAN}"
          podman images --digests
          time podman run --volume "$(pwd):$(pwd)" --workdir "$(pwd)" \
            --env-file <(env | grep -a -E \
              '^(CI\b|CW_|DO_NOT_TRACK|GITHUB_)') \
            "${OCI_IMAGE_DEBIAN}" \
            sh -c ./_ci-linux-debian.sh

  linux-musl-llvm:
    name: 'Linux llvm MUSL (amd64, riscv64)'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: 'curl'
          fetch-depth: 8
      - name: 'build'
        run: |
          git clone --depth 1 https://github.com/curl/curl-for-win
          mv curl-for-win/* .
          export CW_CONFIG='-main-werror-unitybatch-nocertdata-linux-musl-r64-x64'
          export CW_REVISION="${GITHUB_SHA}"
          . ./_versions.sh
          export CW_CCSUFFIX='-19'
          export CW_GCCSUFFIX='-14'
          sudo podman image trust set --type reject default
          sudo podman image trust set --type accept docker.io/library
          time podman pull "${OCI_IMAGE_DEBIAN_STABLE}"
          podman images --digests
          time podman run --volume "$(pwd):$(pwd)" --workdir "$(pwd)" \
            --env-file <(env | grep -a -E \
              '^(CI\b|CW_|DO_NOT_TRACK|GITHUB_)') \
            "${OCI_IMAGE_DEBIAN_STABLE}" \
            sh -c ./_ci-linux-debian.sh

  mac-clang:
    name: 'macOS clang cares (x86_64)'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      CW_JOBS: '4'
    steps:
      - name: 'fixup /etc/ssl/cert.pem'
        run: |
          which curl
          curl -V
          # Apple's vulnerable cert
          ls -lA /etc/ssl/cert.pem
          t="$(mktemp)" && \
            awk -v s='=== /C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' /etc/ssl/cert.pem | \
            awk -v s='=== /C=GB/ST=Greater Manchester/L=Salford/O=Comodo CA Limited/CN=AAA Certificate Services' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' > "$t" && \
            [ -s "$t" ] && sudo install -m 0644 -o root -g wheel "$t" /etc/ssl/cert.pem; rm -f "$t"
          ls -lA /etc/ssl/cert.pem

          # Obsolete Homebrew cert.pem preinstalled on the runners
          ls -lA /opt/homebrew/etc/ca-certificates/cert.pem
          t="$(mktemp)" && \
            awk 'BEGIN { \
              toskip["MIICTjCCAdOgAwIBAgIKPPYHqWhwDtqLhDAKBggqhkjOPQQDAzBrMQswCQYDVQQG"]; \
              toskip["MIIEMjCCAxqgAwIBAgIBATANBgkqhkiG9w0BAQUFADB7MQswCQYDVQQGEwJHQjEb"]; \
              toskip["MIIDlDCCAnygAwIBAgIKMfXkYgxsWO3W2DANBgkqhkiG9w0BAQsFADBnMQswCQYD"] } \
              /^-----BEGIN CERTIFICATE-----$/ \
              { h=$0; inside=1; first=1; next } inside && first \
              { first=0; skip=($0 in toskip); if(!skip) print h; if(!skip) print; next } inside \
              { if(!skip) print; if(/^-----END CERTIFICATE-----$/) inside=0; next; } \
              { print }' < /opt/homebrew/etc/ca-certificates/cert.pem > "$t" && \
            [ -s "$t" ] && install -m 0644 "$t" /opt/homebrew/etc/ca-certificates/cert.pem; rm -f "$t"
          ls -lA /opt/homebrew/etc/ca-certificates/cert.pem

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: 'curl'
          fetch-depth: 8
      - name: 'build'
        run: |
          git clone --depth 1 https://github.com/curl/curl-for-win
          mv curl-for-win/* .
          export CW_CONFIG='-main-werror-unitybatch-nocertdata-mac-x64-cares'
          export CW_REVISION="${GITHUB_SHA}"
          sh -c ./_ci-mac-homebrew.sh

  win-llvm:
    name: 'Windows llvm (x64)'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    env:
      CW_PKG_NODELETE: '1'
      CW_PKG_FLATTEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: 'curl'
          fetch-depth: 8
      - name: 'build'
        run: |
          git clone --depth 1 https://github.com/curl/curl-for-win
          mv curl-for-win/* .
          export CW_CONFIG='-main-werror-unitybatch-nocertdata-win-x64-noWINE'
          export CW_REVISION="${GITHUB_SHA}"
          . ./_versions.sh
          sudo podman image trust set --type reject default
          sudo podman image trust set --type accept docker.io/library
          time podman pull "${OCI_IMAGE_DEBIAN}"
          podman images --digests
          time podman run --volume "$(pwd):$(pwd)" --workdir "$(pwd)" \
            --env-file <(env | grep -a -E \
              '^(CI\b|CW_|DO_NOT_TRACK|GITHUB_)') \
            "${OCI_IMAGE_DEBIAN}" \
            sh -c ./_ci-linux-debian.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'curl-windows-snapshot-tool'
          retention-days: 5
          path: curl-*-*-*/curl*
          archive: false

  win-gcc-zlibold-x64:
    name: 'Windows gcc zlib-classic (x64)'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: 'curl'
          fetch-depth: 8
      - name: 'build'
        run: |
          git clone --depth 1 https://github.com/curl/curl-for-win
          mv curl-for-win/* .
          export CW_CONFIG='-main-werror-unitybatch-nocertdata-curltests-win-x64-gcc-zlibold-noWINE'
          export CW_REVISION="${GITHUB_SHA}"
          . ./_versions.sh
          sudo podman image trust set --type reject default
          sudo podman image trust set --type accept docker.io/library
          time podman pull "${OCI_IMAGE_DEBIAN}"
          podman images --digests
          time podman run --volume "$(pwd):$(pwd)" --workdir "$(pwd)" \
            --env-file <(env | grep -a -E \
              '^(CI\b|CW_|DO_NOT_TRACK|GITHUB_)') \
            "${OCI_IMAGE_DEBIAN}" \
            sh -c ./_ci-linux-debian.sh
