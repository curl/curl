# This workflow contains checks at the source code level only.

name: 'Source'

'on':
  push:
    branches:
      - master
      - 'curl-*'
      - '*/ci'
    paths-ignore:
      - '.circleci/**'
      - 'appveyor.*'
      - 'Dockerfile'
  pull_request:
    branches:
      - master
      - 'curl-*'
    paths-ignore:
      - '.circleci/**'
      - 'appveyor.*'
      - 'Dockerfile'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  DO_NOT_TRACK: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  checksrc:
    name: 'checksrc'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'check'
        run: scripts/checksrc-all.pl

  linters:
    name: 'spellcheck, linters, REUSE'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'cmake options in documentation'
        background: true
        run: scripts/cmakeopts.sh

      - name: 'labelercheck'
        background: true
        run: .github/scripts/labelercheck.sh

      - name: 'perlcheck'
        background: true
        run: scripts/perlcheck.sh

      - name: 'install prereqs (typos)'
        background: true
        timeout-minutes: 2
        run: /home/linuxbrew/.linuxbrew/bin/brew install typos-cli

      - name: 'install prereqs'
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip --disable-pip-version-check --no-input --no-cache-dir install --progress-bar off --prefer-binary \
            -r .github/scripts/requirements.txt \
            -r tests/http/requirements.txt \
            -r tests/requirements.txt

      - name: 'REUSE check'
        background: true
        run: |
          source ~/venv/bin/activate
          reuse lint

      - name: 'cmakelint'
        background: true
        run: |
          source ~/venv/bin/activate
          scripts/cmakelint.sh

      - name: 'ruff'
        background: true
        run: |
          source ~/venv/bin/activate
          scripts/pythonlint.sh

      - name: 'pyrefly'
        background: true
        run: |
          source ~/venv/bin/activate
          cd tests/http/
          pyrefly check --python-version=3.8 --preset=basic --check-unannotated-defs --summary

      - name: 'wait-all'
        wait-all:

      - name: filter off code from all C and H files
        run: |
          git ls-files -z '**.[ch]' | xargs -0 -r -n1 .github/scripts/c-strip

      - name: 'typos'
        background: true
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          typos --version
          .github/scripts/typos.sh

      - name: 'codespell'
        run: |
          source ~/venv/bin/activate
          codespell --version
          .github/scripts/codespell.sh

  pytype:
    name: 'pytype'
    runs-on: ubuntu-24.04-arm  # pytype is discontinued and requires python 3.8-3.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'install prereqs'
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip --disable-pip-version-check --no-input --no-cache-dir install --progress-bar off --prefer-binary pytype==2024.10.11 \
            -r .github/scripts/requirements.txt \
            -r tests/http/requirements.txt \
            -r tests/requirements.txt

      - name: 'check'
        run: |
          source ~/venv/bin/activate
          find . -name '*.py' -exec pytype -j auto -k -- {} +

  complexity:
    name: 'complexity and function sizes'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: 'install pmccabe'
        timeout-minutes: 2
        uses: $/.github/actions/pkg-install
        with:
          apt: pmccabe

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'check function complexity'
        run: ./scripts/top-complexity

      - name: 'check function lengths'
        run: ./scripts/top-length

  xmllint:
    name: 'xmllint'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: 'install prereqs'
        timeout-minutes: 2
        uses: $/.github/actions/pkg-install
        with:
          apt: libxml2-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'check'
        run: git grep -z -i -l -E '^<\?xml' | xargs -0 -r xmllint --output /dev/null

  miscchecks:
    name: 'misc checks'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: 'install prereqs'
        timeout-minutes: 2
        uses: $/.github/actions/pkg-install
        with:
          brew: actionlint shellcheck zizmor

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'zizmor/actionlint (prepare)'
        # Replace custom bash-like shell designators with the standard one to make linters process them
        run: sed -i.bak -E 's/shell\x3a .+ zizmor\x3a ignore.+$/shell\x3a bash/g' .github/workflows/*.yml

      - name: 'zizmor GHA'
        background: true
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          zizmor --persona pedantic .github/workflows/*.yml .github/dependabot.yml

      - name: 'zizmor GHA (auditor, warning-only)'
        background: true
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          zizmor --persona auditor .github/workflows/*.yml .github/dependabot.yml || true

      - name: 'actionlint'
        background: true
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          export SHELLCHECK_OPTS='--exclude=1090,1091,2086,2153 --enable=avoid-nullary-conditions,deprecate-which'
          actionlint --version
          actionlint --ignore matrix \
            --ignore ubuntu-26.04 \
            --ignore ubuntu-24.04-firewall \
            --ignore 'unexpected key "background"' \
            --ignore 'unexpected key "wait"' \
            --ignore 'unexpected key "wait-all"' \
            --ignore 'must run script with "run" section' \
            .github/workflows/*.yml

      - name: 'shellcheck CI'
        background: true
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          shellcheck --version
          .github/scripts/shellcheck-ci.sh

      - name: 'shellcheck'
        background: true
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          shellcheck --version
          .github/scripts/shellcheck.sh

      - name: 'spacecheck'
        background: true
        run: scripts/spacecheck.pl

      - name: 'yamlcheck'
        background: true
        run: .github/scripts/yamlcheck.sh

      - name: 'badwords'
        run: scripts/badwords-all
