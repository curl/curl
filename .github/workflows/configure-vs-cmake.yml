name: 'configure-vs-cmake'
'on':
  push:
    branches:
      - master
      - 'curl-*'
    paths:
      - '*.ac'
      - '**/*.m4'
      - '**/CMakeLists.txt'
      - 'CMake/**'
      - 'lib/curl_config-cmake.h.in'
      - 'tests/cmake/**'
      - '.github/scripts/cmp-config.pl'
      - '.github/workflows/configure-vs-cmake.yml'

  pull_request:
    branches:
      - master
      - 'curl-*'
    paths:
      - '*.ac'
      - '**/*.m4'
      - '**/CMakeLists.txt'
      - 'CMake/**'
      - 'lib/curl_config-cmake.h.in'
      - 'tests/cmake/**'
      - '.github/scripts/cmp-config.pl'
      - '.github/workflows/configure-vs-cmake.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}
cache-mode: none

env:
  CURL_CI: github
  DO_NOT_TRACK: '1'

jobs:
  check-linux:
    name: 'Linux'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'run configure --with-openssl'
        run: |
          autoreconf -fi
          echo '::group::configure --help output'; ./configure --help; echo '::endgroup::'
          export PKG_CONFIG_DEBUG_SPEW=1
          mkdir bld-am && cd bld-am && ../configure --enable-static=no --with-openssl --without-libpsl

      - name: 'run cmake'
        run: cmake -B bld-cm -DCURL_WERROR=ON -DCURL_USE_CMAKECONFIG=OFF -DCURL_USE_LIBPSL=OFF

      - name: 'configure log'
        run: cat bld-am/config.log 2>/dev/null || true

      - name: 'cmake log'
        run: cat bld-cm/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null || true

      - name: 'generated libcurl.pc files'
        run: |
          for f in libcurl.pc curl-config; do
            echo "::group::AM ${f}"; grep -v '^#' bld-am/"${f}" || true; echo '::endgroup::'
            echo "::group::CM ${f}"; grep -v '^#' bld-cm/"${f}" || true; echo '::endgroup::'
          done

      - name: 'compare generated curl_config.h files'
        run: .github/scripts/cmp-config.pl bld-am/lib/curl_config.h bld-cm/lib/curl_config.h

      - name: 'compare generated libcurl.pc files'
        run: .github/scripts/cmp-pkg-config.sh bld-am/libcurl.pc bld-cm/libcurl.pc

      - name: 'compare generated curl-config files'
        run: .github/scripts/cmp-pkg-config.sh bld-am/curl-config bld-cm/curl-config

  check-macos:
    name: 'macOS'
    runs-on: macos-latest
    steps:
      - name: 'fixup /etc/ssl/cert.pem'
        if: ${{ contains(runner.os, 'macos') }}
        run: |
          which curl
          curl -V
          # Apple's vulnerable cert
          ls -lA /etc/ssl/cert.pem
          curl -fsS https://dv-g3b-noct-emudhra.we-have-a-problem.com/ || true
          t="$(mktemp)" && \
            awk -v s='=== /C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' /etc/ssl/cert.pem | \
            awk -v s='=== /C=GB/ST=Greater Manchester/L=Salford/O=Comodo CA Limited/CN=AAA Certificate Services' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' > "$t" && \
            [ -s "$t" ] && sudo install -m 0644 -o root -g wheel "$t" /etc/ssl/cert.pem; rm -f "$t"
          ls -lA /etc/ssl/cert.pem
          curl -fsS https://dv-g3b-noct-emudhra.we-have-a-problem.com/ || true

          # Obsolete Homebrew cert.pem preinstalled on the runners
          ls -lA /opt/homebrew/etc/ca-certificates/cert.pem
          CURL_CA_BUNDLE=/opt/homebrew/etc/ca-certificates/cert.pem curl -fsS https://dv-g3b-noct-emudhra.we-have-a-problem.com/ || true
          t="$(mktemp)" && \
            awk 'BEGIN { \
              toskip["MIICTjCCAdOgAwIBAgIKPPYHqWhwDtqLhDAKBggqhkjOPQQDAzBrMQswCQYDVQQG"]; \
              toskip["MIIEMjCCAxqgAwIBAgIBATANBgkqhkiG9w0BAQUFADB7MQswCQYDVQQGEwJHQjEb"]; \
              toskip["MIIDlDCCAnygAwIBAgIKMfXkYgxsWO3W2DANBgkqhkiG9w0BAQsFADBnMQswCQYD"] } \
              /^-----BEGIN CERTIFICATE-----$/ \
              { h=$0; inside=1; first=1; next } inside && first \
              { first=0; skip=($0 in toskip); if(!skip) print h; if(!skip) print; next } inside \
              { if(!skip) print; if(/^-----END CERTIFICATE-----$/) inside=0; next; } \
              { print }' < /opt/homebrew/etc/ca-certificates/cert.pem > "$t" && \
            [ -s "$t" ] && install -m 0644 "$t" /opt/homebrew/etc/ca-certificates/cert.pem; rm -f "$t"
          ls -lA /opt/homebrew/etc/ca-certificates/cert.pem
          CURL_CA_BUNDLE=/opt/homebrew/etc/ca-certificates/cert.pem curl -fsS https://dv-g3b-noct-emudhra.we-have-a-problem.com/ || true

      - name: 'install prereqs'
        timeout-minutes: 2
        uses: $/.github/actions/pkg-install
        with:
          brew: automake libtool

      - name: 'toolchain versions'
        run: echo '::group::brew packages installed'; ls -l /opt/homebrew/opt; echo '::endgroup::'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'run configure --with-openssl'
        run: |
          autoreconf -fi
          echo '::group::configure --help output'; ./configure --help; echo '::endgroup::'
          export PKG_CONFIG_DEBUG_SPEW=1
          mkdir bld-am && cd bld-am && ../configure --enable-static=no --with-openssl --without-libpsl --disable-ldap --with-brotli --with-zstd --with-apple-sectrust

      - name: 'run cmake'
        run: |
          cmake -B bld-cm -DCURL_WERROR=ON -DCURL_USE_CMAKECONFIG=OFF -DCURL_USE_LIBPSL=OFF -DCURL_DISABLE_LDAP=ON \
            -DCMAKE_C_COMPILER_TARGET="$(uname -m | sed 's/arm64/aarch64/')-apple-darwin$(uname -r)" \
            -DCURL_USE_LIBSSH2=OFF -DUSE_APPLE_SECTRUST=ON

      - name: 'configure log'
        run: cat bld-am/config.log 2>/dev/null || true

      - name: 'cmake log'
        run: cat bld-cm/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null || true

      - name: 'generated libcurl.pc files'
        run: |
          for f in libcurl.pc curl-config; do
            echo "::group::AM ${f}"; grep -v '^#' bld-am/"${f}" || true; echo '::endgroup::'
            echo "::group::CM ${f}"; grep -v '^#' bld-cm/"${f}" || true; echo '::endgroup::'
          done
          pccritic --version
          pccritic --min-score 98 bld-am/libcurl.pc
          pccritic --min-score 98 bld-cm/libcurl.pc

      - name: 'compare generated curl_config.h files'
        run: .github/scripts/cmp-config.pl bld-am/lib/curl_config.h bld-cm/lib/curl_config.h

      - name: 'compare generated libcurl.pc files'
        run: .github/scripts/cmp-pkg-config.sh bld-am/libcurl.pc bld-cm/libcurl.pc

      - name: 'compare generated curl-config files'
        run: .github/scripts/cmp-pkg-config.sh bld-am/curl-config bld-cm/curl-config

  check-windows:
    name: 'Windows'
    runs-on: ubuntu-26.04-arm
    env:
      TRIPLET: 'x86_64-w64-mingw32'
    steps:
      - name: 'install prereqs'
        timeout-minutes: 1
        uses: $/.github/actions/pkg-install
        with:
          apt: gcc-mingw-w64-x86-64-win32

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'run configure --with-schannel'
        run: |
          autoreconf -fi
          echo '::group::configure --help output'; ./configure --help; echo '::endgroup::'
          export PKG_CONFIG_DEBUG_SPEW=1
          mkdir bld-am && cd bld-am && ../configure --enable-static=no --with-schannel --without-libpsl --host="${TRIPLET}"

      - name: 'run cmake'
        run: |
          cmake -B bld-cm -DCURL_WERROR=ON -DCURL_USE_CMAKECONFIG=OFF -DCURL_USE_SCHANNEL=ON -DCURL_USE_LIBPSL=OFF \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER_TARGET="${TRIPLET}" \
            -DCMAKE_C_COMPILER="${TRIPLET}-gcc"

      - name: 'configure log'
        run: cat bld-am/config.log 2>/dev/null || true

      - name: 'cmake log'
        run: cat bld-cm/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null || true

      - name: 'generated libcurl.pc files'
        run: |
          for f in libcurl.pc curl-config; do
            echo "::group::AM ${f}"; grep -v '^#' bld-am/"${f}" || true; echo '::endgroup::'
            echo "::group::CM ${f}"; grep -v '^#' bld-cm/"${f}" || true; echo '::endgroup::'
          done

      - name: 'compare generated curl_config.h files'
        run: .github/scripts/cmp-config.pl bld-am/lib/curl_config.h bld-cm/lib/curl_config.h

      - name: 'compare generated libcurl.pc files'
        run: .github/scripts/cmp-pkg-config.sh bld-am/libcurl.pc bld-cm/libcurl.pc

      - name: 'compare generated curl-config files'
        run: .github/scripts/cmp-pkg-config.sh bld-am/curl-config bld-cm/curl-config
